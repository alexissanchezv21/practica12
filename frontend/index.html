<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="contenedor-principal">
        <header class="encabezado">
            <h1 class="titulo">Iniciar Sesión</h1>
        </header>

        <form id="form-login" class="cuerpo-formulario">
            <div class="grupo-entrada">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" class="entrada-texto" required placeholder="correo@ejemplo.com">
            </div>

            <div class="grupo-entrada">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="entrada-texto" required placeholder="Tu contraseña">
            </div>

            <div class="botones">
                <button type="submit" class="btn-registrar">Entrar</button>
            </div>
        </form>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
